name: native-verification
on:
  pull_request:
    paths:
      - 'app/**'
      - 'verification/20261013-fixed/**'
      - '.github/workflows/native-verification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew -I verification/20261013-fixed/probe.init.gradle :app:assembleDebug
      - name: Enable KVM for the isolated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_5
          script: bash verification/20261013-fixed/run.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-13-verification
          path: build/verification-fixed/device-results.txt
